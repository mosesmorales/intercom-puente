name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: intercom-puente-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Intercom Puente - build ${{ github.run_number }}
          body: APK de prueba (debug). Descargalo e instalalo en el telefono.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
